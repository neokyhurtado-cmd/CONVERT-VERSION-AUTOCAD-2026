name: Reporte de error / Bug report
description: Reportar un comportamiento con datos no confidenciales
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "No adjuntes DWG de clientes, datos personales, claves, planos o documentos reservados."
  - type: input
    id: version
    attributes:
      label: Version de DWG Version Switch
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: autocad
    attributes:
      label: Version de AutoCAD instalada
      placeholder: AutoCAD 2027
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir con datos sinteticos o propios
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado y observado
    validations:
      required: true
